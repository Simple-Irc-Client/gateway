name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install and build
        run: |
          npm ci
          npm run test
          npm run build

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "ERROR: SSH_KEY is not set"; exit 1; fi
          if [ -z "$SSH_HOST" ]; then echo "ERROR: SSH_HOST is not set"; exit 1; fi
          if [ -z "$SSH_PASS" ]; then echo "ERROR: SSH_PASS is not set"; exit 1; fi
          echo "All secrets are set"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH key written"

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "Host key scanned"

          eval "$(ssh-agent -s)"
          echo "SSH agent started"

          ASKPASS_SCRIPT=$(mktemp)
          echo '#!/bin/sh' > "$ASKPASS_SCRIPT"
          echo "echo \"\$SSH_PASS\"" >> "$ASKPASS_SCRIPT"
          chmod +x "$ASKPASS_SCRIPT"
          SSH_ASKPASS="$ASKPASS_SCRIPT" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f "$ASKPASS_SCRIPT"
          echo "SSH key added to agent"

          ssh root@$SSH_HOST "mkdir -p /opt/sic-gateway"
          echo "Remote directory created"

          scp dist/gateway.js root@$SSH_HOST:/opt/sic-gateway/gateway.js
          echo "File deployed"

          ssh root@$SSH_HOST "systemctl restart sic-gateway"
          echo "Service restarted"
