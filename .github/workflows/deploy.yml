name: Deploy to production

on:
  push:
    branches: [main]

env:
  DEPLOY_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install, test, and lint
        run: |
          pnpm install --frozen-lockfile
          pnpm run test
          pnpm run lint

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            simpleircclient/simple-irc-gateway:latest
            simpleircclient/simple-irc-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "ERROR: SSH_KEY is not set"; exit 1; fi
          if [ -z "$SSH_HOST" ]; then echo "ERROR: SSH_HOST is not set"; exit 1; fi
          echo "All secrets are set"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Use the deploy key for all ssh/scp calls to this host (no agent needed —
          # the key has no passphrase).
          cat >> ~/.ssh/config << EOF
          Host $SSH_HOST
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          echo "SSH key configured"

      - name: Deploy container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          IMAGE="docker.io/simpleircclient/simple-irc-gateway:${{ github.sha }}"

          ssh $DEPLOY_USER@$SSH_HOST "sudo podman pull $IMAGE"
          echo "Image pulled"

          echo "Removing stale Quadlet service if present..."
          ssh $DEPLOY_USER@$SSH_HOST "
            if systemctl list-unit-files container-sic-gateway.service &>/dev/null; then
              sudo systemctl stop container-sic-gateway.service 2>/dev/null || true
              sudo systemctl disable container-sic-gateway.service 2>/dev/null || true
            fi
            sudo rm -f /etc/containers/systemd/sic-gateway.container
            sudo systemctl daemon-reload
          "
          echo "Quadlet cleanup done"

          echo "Deploying systemd service..."
          # Substitute the image locally and pipe the final unit straight to the
          # protected path via sudo tee (no scp-to-/etc, no sudo sed).
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" deploy/sic-gateway.service \
            | ssh $DEPLOY_USER@$SSH_HOST "sudo tee /etc/systemd/system/sic-gateway.service" >/dev/null
          ssh $DEPLOY_USER@$SSH_HOST "sudo systemctl daemon-reload && sudo systemctl enable sic-gateway.service"
          echo "Service deployed"

          echo "Restarting service..."
          ssh $DEPLOY_USER@$SSH_HOST "sudo systemctl restart sic-gateway.service"
          echo "Service restarted"

          sleep 5
          ssh $DEPLOY_USER@$SSH_HOST "sudo systemctl is-active sic-gateway.service" || {
            echo "ERROR: sic-gateway service is not active"
            ssh $DEPLOY_USER@$SSH_HOST "sudo journalctl -u sic-gateway.service --no-pager -n 50"
            exit 1
          }
          echo "Service is running"

      - name: Setup Caddy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh $DEPLOY_USER@$SSH_HOST "sudo tee /etc/caddy/Caddyfile" < deploy/Caddyfile >/dev/null
          ssh $DEPLOY_USER@$SSH_HOST "sudo systemctl reload caddy"
          echo "Caddyfile deployed and Caddy reloaded"

      - name: Deploy firewall script and cronjob
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_FIREWALL: ${{ secrets.HCLOUD_FIREWALL }}
        run: |
          echo "Deploying firewall script..."
          # /opt/sic-gateway is owned by the deploy user (created by bootstrap.sh),
          # so the script and env file are written without sudo.
          scp deploy/update-firewall.sh $DEPLOY_USER@$SSH_HOST:/opt/sic-gateway/update-firewall.sh
          ssh $DEPLOY_USER@$SSH_HOST "chmod +x /opt/sic-gateway/update-firewall.sh"
          echo "Firewall script deployed"

          echo "Writing firewall env file..."
          ssh $DEPLOY_USER@$SSH_HOST "printf '%s\n' 'HCLOUD_TOKEN=$HCLOUD_TOKEN' 'HCLOUD_FIREWALL=$HCLOUD_FIREWALL' > /opt/sic-gateway/.env && chmod 600 /opt/sic-gateway/.env"
          echo "Env file written"

          echo "Running firewall update..."
          ssh $DEPLOY_USER@$SSH_HOST "sudo /opt/sic-gateway/update-firewall.sh"
          echo "Firewall updated"

          echo "Setting up firewall cronjob..."
          ssh $DEPLOY_USER@$SSH_HOST "
            CRON_CMD=\"0 */6 * * * sudo /opt/sic-gateway/update-firewall.sh >> /opt/sic-gateway/update-firewall.log 2>&1\"
            crontab -l 2>/dev/null | grep -v 'update-firewall' | { cat; echo \"\$CRON_CMD\"; } | crontab -
          "
          echo "Cronjob configured"

      - name: Verify firewall setup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_FIREWALL: ${{ secrets.HCLOUD_FIREWALL }}
        run: |
          ssh $DEPLOY_USER@$SSH_HOST "crontab -l" | grep -q "update-firewall" || {
            echo "ERROR: Firewall cronjob is missing"
            exit 1
          }
          echo "Firewall cronjob verified"

          ssh $DEPLOY_USER@$SSH_HOST "sudo nft list table inet sic-firewall" >/dev/null || {
            echo "ERROR: nftables sic-firewall table missing"
            exit 1
          }
          echo "nftables SSH rules verified"

          RULES=$(curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls?name=$HCLOUD_FIREWALL" \
            | jq '.firewalls[0].rules')

          echo "$RULES" | jq -e '.[] | select(.description == "identd")' >/dev/null || {
            echo "ERROR: Missing identd rule"; exit 1
          }
          echo "identd rule verified"

          echo "$RULES" | jq -e '.[] | select(.description == "HTTPS")' >/dev/null || {
            echo "ERROR: Missing HTTPS rule"; exit 1
          }
          echo "HTTPS rule verified"

          echo "$RULES" | jq -e '.[] | select(.description == "ICMP")' >/dev/null || {
            echo "ERROR: Missing ICMP rule"; exit 1
          }
          echo "ICMP rule verified"

          SSH_RULE_COUNT=$(echo "$RULES" | jq '[.[] | select(.port == "22")] | length')
          echo "Hetzner firewall has $SSH_RULE_COUNT SSH rule(s) (admin IPs)"

          RULE_COUNT=$(echo "$RULES" | jq length)
          echo "All $RULE_COUNT Hetzner firewall rules verified"
