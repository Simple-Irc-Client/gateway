name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install, test, and lint
        run: |
          npm ci
          npm run test
          npm run lint

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            simpleircclient/simple-irc-gateway:latest
            simpleircclient/simple-irc-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "ERROR: SSH_KEY is not set"; exit 1; fi
          if [ -z "$SSH_HOST" ]; then echo "ERROR: SSH_HOST is not set"; exit 1; fi
          if [ -z "$SSH_PASS" ]; then echo "ERROR: SSH_PASS is not set"; exit 1; fi
          echo "All secrets are set"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          ASKPASS_SCRIPT=$(mktemp)
          echo '#!/bin/sh' > "$ASKPASS_SCRIPT"
          echo "echo \"\$SSH_PASS\"" >> "$ASKPASS_SCRIPT"
          chmod +x "$ASKPASS_SCRIPT"
          SSH_ASKPASS="$ASKPASS_SCRIPT" SSH_ASKPASS_REQUIRE=force ssh-add ~/.ssh/deploy_key
          rm -f "$ASKPASS_SCRIPT"
          echo "SSH key added to agent"

      - name: Ensure podman is installed on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh root@$SSH_HOST 'if ! command -v podman &> /dev/null; then
            echo "Podman not found, installing..."
            apt-get update
            apt-get install -y podman
            echo "Podman installed"
          else
            echo "Podman already installed, skipping"
          fi'

      - name: Deploy container
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          IMAGE="docker.io/simpleircclient/simple-irc-gateway:${{ github.sha }}"

          ssh root@$SSH_HOST "podman pull $IMAGE"
          echo "Image pulled"

          ssh root@$SSH_HOST "podman stop sic-gateway 2>/dev/null; podman rm sic-gateway 2>/dev/null; echo 'Old container removed'"

          ssh root@$SSH_HOST "podman run -d \
            --name sic-gateway \
            --restart unless-stopped \
            -p 8667:8667 \
            -p 113:8113 \
            -e PORT=8667 \
            -e HOST=0.0.0.0 \
            -e PATH_PREFIX=/webirc \
            -e ALLOWED_ORIGINS=https://app.simpleircclient.com \
            -e IDENTD_ENABLED=true \
            -e IDENTD_PORT=8113 \
            $IMAGE"
          echo "Container started"

          ssh root@$SSH_HOST 'cd /etc/systemd/system && podman generate systemd --name --new sic-gateway > container-sic-gateway.service && systemctl daemon-reload && systemctl enable container-sic-gateway.service'
          echo "Systemd service created and enabled"

          sleep 5
          ssh root@$SSH_HOST "podman ps --filter name=sic-gateway --filter status=running -q" | grep -q . || {
            echo "ERROR: sic-gateway container is not running"
            ssh root@$SSH_HOST "podman logs sic-gateway --tail 50"
            exit 1
          }
          echo "Container is running"

      - name: Setup Caddy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh root@$SSH_HOST 'if ! command -v caddy &> /dev/null; then
            echo "Caddy not found, installing..."
            apt-get update
            apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
            curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/gpg.key" | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
            curl -1sLf "https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt" | tee /etc/apt/sources.list.d/caddy-stable.list
            apt-get update
            apt-get install -y caddy
            echo "Caddy installed"
          else
            echo "Caddy already installed, skipping"
          fi'

          ssh root@$SSH_HOST 'if [ ! -f /etc/caddy/Caddyfile ]; then
            mkdir -p /etc/caddy
            cat > /etc/caddy/Caddyfile << "CADDYFILE"
          irc.simpleircclient.com {
              reverse_proxy 127.0.0.1:8667 {
                transport http {
                  versions 1.1
                }
              }
          }
          CADDYFILE
            systemctl reload caddy
            echo "Caddyfile created and Caddy reloaded"
          else
            echo "Caddyfile already exists, skipping"
          fi'

      - name: Deploy firewall script and cronjob
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_FIREWALL: ${{ secrets.HCLOUD_FIREWALL }}
        run: |
          echo "Deploying firewall script..."
          ssh root@$SSH_HOST "mkdir -p /opt/sic-gateway"
          scp scripts/update-firewall.sh root@$SSH_HOST:/opt/sic-gateway/update-firewall.sh
          ssh root@$SSH_HOST "chmod +x /opt/sic-gateway/update-firewall.sh"
          echo "Firewall script deployed"

          echo "Running firewall update..."
          ssh root@$SSH_HOST "HCLOUD_TOKEN='$HCLOUD_TOKEN' HCLOUD_FIREWALL='$HCLOUD_FIREWALL' /opt/sic-gateway/update-firewall.sh"
          echo "Firewall updated"

          echo "Setting up firewall cronjob..."
          ssh root@$SSH_HOST "
            CRON_CMD=\"0 */6 * * * HCLOUD_TOKEN='$HCLOUD_TOKEN' HCLOUD_FIREWALL='$HCLOUD_FIREWALL' /opt/sic-gateway/update-firewall.sh >> /var/log/update-firewall.log 2>&1\"
            crontab -l 2>/dev/null | grep -v 'update-firewall' | { cat; echo \"\$CRON_CMD\"; } | crontab -
          "
          echo "Cronjob configured"

      - name: Verify firewall setup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          HCLOUD_FIREWALL: ${{ secrets.HCLOUD_FIREWALL }}
        run: |
          ssh root@$SSH_HOST "crontab -l" | grep -q "update-firewall" || {
            echo "ERROR: Firewall cronjob is missing"
            exit 1
          }
          echo "Firewall cronjob verified"

          ssh root@$SSH_HOST "nft list table inet sic-firewall" >/dev/null || {
            echo "ERROR: nftables sic-firewall table missing"
            exit 1
          }
          echo "nftables SSH rules verified"

          RULES=$(curl -sf -H "Authorization: Bearer $HCLOUD_TOKEN" \
            "https://api.hetzner.cloud/v1/firewalls?name=$HCLOUD_FIREWALL" \
            | jq '.firewalls[0].rules')

          echo "$RULES" | jq -e '.[] | select(.description == "identd")' >/dev/null || {
            echo "ERROR: Missing identd rule"; exit 1
          }
          echo "identd rule verified"

          echo "$RULES" | jq -e '.[] | select(.description == "HTTPS")' >/dev/null || {
            echo "ERROR: Missing HTTPS rule"; exit 1
          }
          echo "HTTPS rule verified"

          echo "$RULES" | jq -e '.[] | select(.description == "ICMP")' >/dev/null || {
            echo "ERROR: Missing ICMP rule"; exit 1
          }
          echo "ICMP rule verified"

          SSH_RULE_COUNT=$(echo "$RULES" | jq '[.[] | select(.port == "22")] | length')
          echo "Hetzner firewall has $SSH_RULE_COUNT SSH rule(s) (admin IPs)"

          RULE_COUNT=$(echo "$RULES" | jq length)
          echo "All $RULE_COUNT Hetzner firewall rules verified"
