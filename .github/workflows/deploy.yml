name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Install and build
        run: |
          npm ci
          npm run test
          npm run build

      - name: Deploy via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_CMD="sshpass -p '$SSH_PASS' ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new root@$SSH_HOST"
          SCP_CMD="sshpass -p '$SSH_PASS' scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          $SSH_CMD "mkdir -p /opt/sic-gateway"
          $SCP_CMD dist/gateway.js root@$SSH_HOST:/opt/sic-gateway/gateway.js
          $SSH_CMD "systemctl restart sic-gateway"
